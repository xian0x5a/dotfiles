description = "Sunshine host streaming configuration"

# WayVNC (with its noVNC web bridge) is the remote fallback for approving the
# Sunshine portal dialog when the pre-approved restore token stops matching.
# Avahi provides mDNS advertisement on the physical LAN only.
depends = [
  "wayvnc",
  "linux/avahi",
]

[targets.d_config_sunshine]
source = "files/config/sunshine"
path = "~/.config/sunshine"

[targets.d_config_sunshine.ignore]
patterns = [
  "tests/",
  "sunshine-*.conf",
  "sunshine.conf",
  "credentials/",
  "sunshine.log",
  "sunshine.log.*",
  "portal_token*",
  "*_state.json",
]

[targets.f_config_sunshine_sunshine_conf]
source = "files/sunshine.conf"
path = "~/.config/sunshine/sunshine.conf"
preset = "jinja-patch-editor"
render = '{{ UV_RUN }} "$DOTMAN_REPO_ROOT/scripts/select_render_gpu.py" render "$DOTMAN_REPO_PATH"'

# Pre-approve the ScreenCast portal share of the Niri `sunshine` output so a new
# machine needs no dialog click. The probe re-checks the permission store on every
# push, so a lost token is re-seeded even when no Sunshine file changed.
[targets.portal_restore_token]
sync_policy = "push-only"
probe = 'sh "$DOTMAN_PACKAGE_ROOT/scripts/portal_restore_token.sh" check "{{ vars.desktop.session }}" sunshine'

[targets.portal_restore_token.hooks]
# The restore data format is xdg-desktop-portal-gnome's, as used by Niri.
guard_push = '[ "{{ vars.desktop.session }}" = niri ] || exit 100'
pre_push = 'sh "$DOTMAN_PACKAGE_ROOT/scripts/portal_restore_token.sh" seed "{{ vars.desktop.session }}" sunshine'

[targets.d_config_systemd_user_sunshine_service_d]
source = "files/config/systemd/user/sunshine.service.d"
path = "~/.config/systemd/user/sunshine.service.d"

[hooks]
pre_push = [
  "{{ INSTALL }} sunshine",
]
post_push = [
  '{{ ENSURE_SYSTEMD }} user sunshine.service',
]
