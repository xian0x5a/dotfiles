description = "Google Antigravity desktop app and CLI (agy) configuration"
depends = ["agents"]

[vars.antigravity]
# agy writes these itself: `/model` saves the model, the trust prompt adds
# folders, and the Google Cloud sign-in saves `gcp`. They stay live-local.
cli_settings_selectors = ["model", "trustedWorkspaces", "gcp"]
# config.json mixes desktop-app settings with machine state (sidecar projects,
# migration flags, the remote-control hostname), so it syncs by allowlist.
# The Turbo preset covers the older autoExecutionPolicy, sandbox and
# non-workspace access keys, which only business accounts use.
app_config_selectors = [
  "userSettings.permissionPreset",
  "userSettings.themeMode",
]

# The desktop app updates itself only as an AppImage on Linux: the AUR build
# unpacks Google's .tar.gz into /opt, and its updater gives up with "APPIMAGE env
# is not defined". So we install the AppImage once and the app replaces the file
# in place from then on. The Homebrew cask updates itself (`auto_updates`).
# The app registers its sign-in link handler through the menu entry, so the
# entry keeps its MimeType.
[targets.antigravity_installed]
sync_policy = "push-only"
probe = '{% if os == "linux" %}{{ PROBE_APPIMAGE_INSTALLED }} --name antigravity --link-command{% elif os == "darwin" %}{{ PROBE_PACKAGES_INSTALLED }} antigravity{% endif %}'

[targets.antigravity_installed.hooks]
pre_push = '{% if os == "linux" %}url=$(sh "$DOTMAN_PACKAGE_ROOT/scripts/latest_appimage_url.sh" {{ cpu_arch }}) && {{ APPIMAGE_INSTALL }} --name antigravity --url "$url" --link-command{% elif os == "darwin" %}{{ INSTALL }} antigravity{% endif %}'

# agy updates itself only where it can write its own binary, so it lives in
# ~/.local/bin. Package-manager builds sit in root-owned /usr/bin, where agy
# skips its updates. The probe checks that path, not PATH: a leftover
# package-manager agy on PATH would hide a missing self-updating install.
[targets.antigravity_cli_installed]
sync_policy = "push-only"
probe = 'if [ -x "$HOME/.local/bin/agy" ]; then exit 100; fi; exit 0'

[targets.antigravity_cli_installed.hooks]
pre_push = 'sh "$DOTMAN_PACKAGE_ROOT/scripts/install_agy.sh"'

[targets.antigravity_global_instructions]
sync_policy = "push-only"
probe = 'sh "$DOTMAN_REPO_ROOT/scripts/manage_relative_symlink.sh" probe "~/.gemini/AGENTS.md" "~/.agents/AGENTS.md"'

[targets.antigravity_global_instructions.hooks]
pre_push = 'sh "$DOTMAN_REPO_ROOT/scripts/manage_relative_symlink.sh" apply "~/.gemini/AGENTS.md" "~/.agents/AGENTS.md"'

# Points Antigravity at the agent-neutral skills; codex and pi read
# ~/.agents/skills on their own. agy 1.5.11 rejects `~/` in this file ("must be
# an absolute path"), though its docs allow it, so the repo keeps `~/` and push
# writes $HOME.
[targets.f_gemini_config_skills_json]
source = "files/gemini/config/skills.json"
path = "~/.gemini/config/skills.json"
render = 'dotman rewrite home expand "$DOTMAN_REPO_PATH"'
capture = 'dotman rewrite home collapse "$DOTMAN_LIVE_PATH"'

# Desktop-app settings. Capture keeps only the allowlist; render keeps all live
# state and overlays the allowlist from the repo.
[targets.f_gemini_config_config_json]
source = "files/gemini/config/config.json"
path = "~/.gemini/config/config.json"
chmod = "600"
render = '{{ JSON_RENDER }} --selector-type remove --selectors {{ vars.antigravity.app_config_selectors|shell_args }}'
capture = '{{ JSON_CAPTURE }} --selector-type retain --selectors {{ vars.antigravity.app_config_selectors|shell_args }}'

# CLI-only settings. agy rewrites this file at startup and drops keys set to
# their defaults, so the repo copy holds only non-default values. agy saves it
# as 0600.
[targets.f_gemini_antigravity_cli_settings_json]
source = "files/gemini/antigravity-cli/settings.json"
path = "~/.gemini/antigravity-cli/settings.json"
chmod = "600"
render = '{{ JSON_RENDER }} --selector-type retain --selectors {{ vars.antigravity.cli_settings_selectors|shell_args }}'
capture = '{{ JSON_CAPTURE }} --selector-type remove --selectors {{ vars.antigravity.cli_settings_selectors|shell_args }}'
