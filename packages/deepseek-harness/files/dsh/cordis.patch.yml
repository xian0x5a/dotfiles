# Each row replaces the target entry's whole config, and only rows that every profile mounts belong here.
- id: llm-pi-ai
  config:
    providers:
      # No models list: the installed pi-ai catalog supplies every model with its own wire protocol,
      # which one hand-declared route could not do because OpenCode Go mixes three protocols.
      opencode-go:
        displayName: OpenCode Go
        apiKeyEnv: OPENCODE_API_KEY
# Only the ACP profile (T3) mounts this top-level row live; Web presets nest their own copies, which patches cannot address.
- id: compaction-basic
  config:
    # compaction-basic only accepts a window fraction; 0.33 of a 1M-token window triggers at about 330k tokens.
    thresholdRatio: 0.33
